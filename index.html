<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akkati Akshaya – Portfolio</title>
<meta name="description" content="Portfolio of Akkati Akshaya, B.Tech CSE (AI & ML) student.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0c0c10;--bg2:#0f1838;--card:#17171c;--ink:#f1f3f7;--muted:#b4bccb;--accent:#17cdbd;--on:#04201d;--line:#26303f;--field:#1b1b21;--shadow:0 12px 32px #000a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f7fb;--bg2:#dfe9fb;--card:#fff;--ink:#101a2b;--muted:#52607a;--accent:#0b8f84;--on:#fff;--line:#cfd9e8;--field:#fff;--shadow:0 10px 26px #1a2a4a22;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;color:var(--ink);font:400 1rem/1.7 Poppins,system-ui,sans-serif;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 38%,var(--bg) 62%,var(--bg2) 82%,var(--bg) 100%);min-height:100vh}
a{color:var(--accent)}
:focus-visible{outline:3px solid #a78bfa;outline-offset:3px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:29;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{max-width:1100px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:1.15rem;color:var(--accent);text-decoration:none;margin-right:auto}
.av{width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-size:.8rem;overflow:hidden;color:var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
nav .l{color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem;opacity:.85}
nav .l:hover,nav .l.on{color:var(--accent);opacity:1}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 11px;font:500 .82rem Poppins,sans-serif;cursor:pointer}
main{max-width:1100px;margin:auto;padding:0 24px}
.hero{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 0 40px}
.photo{width:clamp(130px,22vw,170px);aspect-ratio:1;border-radius:50%;border:4px solid var(--accent);box-shadow:0 0 36px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center;font-size:3rem;font-weight:700;color:var(--accent);overflow:hidden;background:var(--card)}
.photo img{width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(1.9rem,5.5vw,3rem);font-weight:600;margin:26px 0 6px}
.good{font-size:1.05rem;margin:0 0 28px;min-height:2em}
.grad{font-weight:700;font-size:1.15em;background:linear-gradient(90deg,#c084fc,#f0abfc,#38bdf8,#a78bfa,#f472b6,#c084fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4px;filter:drop-shadow(0 0 8px #a855f7aa);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.caret{display:inline-block;width:2px;height:1.1em;background:#c084fc;vertical-align:-.2em;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.btn{display:inline-block;background:var(--accent);color:var(--on);padding:12px 26px;border-radius:8px;font:600 .95rem Poppins,sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
section.s{padding:84px 0 0;text-align:center}
h2{font-size:clamp(1.9rem,4vw,2.5rem);font-weight:700;color:var(--accent);margin:0 0 36px}
.about p{max-width:880px;margin:0 auto 14px;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;max-width:1000px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:22px 18px;box-shadow:var(--shadow);transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.card h3{font-size:1.05rem;font-weight:600;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:color-mix(in srgb,var(--accent) 14%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px;padding:3px 12px;font-size:.88rem}
.tl{position:relative;max-width:820px;margin:auto}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--accent);transform:translateX(-1px)}
.ti{position:relative;width:50%;padding:0 30px 28px 0}
.ti:nth-child(even){margin-left:50%;padding:0 0 28px 30px}
.ti::after{content:"";position:absolute;top:22px;right:-7px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.ti:nth-child(even)::after{right:auto;left:-7px}
.ti .card{padding:16px 18px}
.ti h3{font-size:1rem;margin:0 0 4px}
.ti p{margin:0;color:var(--muted);font-size:.9rem}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;max-width:1000px;margin:auto}
.pc{background:var(--card);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:transform .25s}
.pc:hover{transform:translateY(-4px)}
.pc h3{font-size:1.15rem;font-weight:600;margin:0}
.pc ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;text-align:left;color:var(--muted);font-size:.95rem}
.pc li::before{content:"• ";color:var(--accent)}
.pc .chips{margin-top:auto}
.pc a.v{color:var(--accent);font-weight:600;text-decoration:none}
form{max-width:480px;margin:auto;display:grid;gap:12px;text-align:left}
input,textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:11px 12px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
form .btn{width:100%}
.links{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.links a{font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
footer{margin-top:80px;padding:22px;text-align:center;color:var(--muted);font-size:.88rem;background:color-mix(in srgb,var(--bg) 70%,transparent);border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media(max-width:700px){nav .l{display:none}.tl::before{left:8px}.ti,.ti:nth-child(even){width:100%;margin-left:0;padding:0 0 22px 34px}.ti::after,.ti:nth-child(even)::after{left:1px;right:auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.caret,.grad{animation:none}.rv{opacity:1;transform:none;transition:none}.card:hover,.pc:hover,.btn:hover{transform:none}}
</style>
</head>

</section>
</main>

const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.textContent = h; return e; };

const ini = DATA.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
[$("photo"), $("navAv")].forEach(box => {
  if (DATA.photo) { const i = new Image(); i.src = DATA.photo; i.alt = DATA.name; box.appendChild(i); } else box.textContent = ini;
});

for (const [g, items] of Object.entries(DATA.skills)) {
  const c = el("div", "card"); c.appendChild(el("h3", "", g));
  const ch = el("div", "chips"); items.forEach(s => ch.appendChild(el("span", "chip", s)));
  c.appendChild(ch); $("skillCards").appendChild(c);
}
DATA.timeline.forEach(t => { const w = el("div", "ti"), c = el("div", "card"); c.appendChild(el("h3", "", t.title)); c.appendChild(el("p", "", t.line)); w.appendChild(c); $("tl").appendChild(w); });
DATA.projects.forEach(p => {
  const c = el("div", "pc"); c.appendChild(el("h3", "", p.title));
  const ul = el("ul"); p.points.forEach(t => ul.appendChild(el("li", "", t))); c.appendChild(ul);
  const ch = el("div", "chips"); p.tags.forEach(t => ch.appendChild(el("span", "chip", t))); c.appendChild(ch);

  $("projGrid").appendChild(c);

$("cf").addEventListener("submit", e => {

});

/* typing line */
(function () {
  const t = $("typed"), w = DATA.goodAt;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { let k = 0; t.textContent = w[0]; setInterval(() => { k = (k + 1) % w.length; t.textContent = w[k]; }, 2000); return; }
  let i = 0, j = 0, del = false;
  (function tick() {
    const s = w[i]; t.textContent = s.slice(0, j);
    if (!del && j === s.length) { del = true; return setTimeout(tick, 1400); }
    if (del && j === 0) { del = false; i = (i + 1) % w.length; }
    j += del ? -1 : 1; setTimeout(tick, del ? 40 : 90);
  })();
})();

/* reveal + active nav */
(function () {
  const rv = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { rv.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .06 });
  rv.forEach(e => io.observe(e));
  const links = [...document.querySelectorAll("nav .l")];
  const so = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
  ["about", "skills", "education", "projects", "contact"].forEach(id => so.observe($(id)));
})();

$("theme").addEventListener("click", () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
});
